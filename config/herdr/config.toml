onboarding = false

[ui]
sidebar_width = 34
sidebar_max_width = 44
# Distinct glyphs per agent state (blocked / working / done / idle) instead of same-looking dots.
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false

# Apple Terminal (macOS 15) drops 24-bit RGB colours, so hex colours render grey there.
# The "terminal" theme uses ANSI colours instead. herdr colours idle with "green" and working with "yellow";
# remap them so working = green, idle = blue, blocked stays red, done = teal.
# In iTerm2 (true colour) you can pick any theme instead.
[theme.custom]
green = "blue"
yellow = "green"

# Direct keys on the RIGHT Option key (iTerm2: Profiles > Keys > Right Option key = Esc+;
# Apple Terminal: Settings > Profiles > Keyboard > "Use Option as Meta key", which takes both Option keys).
# Left Option stays normal in iTerm2, so # and € and word-jumps keep working. Actions rebound here no longer use
# their ctrl+b key; all other ctrl+b keys still work.
[keys]
# Each letter key also has its Russian-layout twin (same physical key), so hotkeys work on either layout.
# Drop the second entry of each pair if you only type in English.
previous_tab = ["alt+[", "alt+х"]
next_tab = ["alt+]", "alt+ъ"]
next_agent = "alt+tab"
previous_agent = "alt+shift+tab"
workspace_picker = ["alt+w", "alt+ц"]
open_notification_target = ["alt+o", "alt+щ"]
zoom = ["alt+z", "alt+я"]
toggle_sidebar = ["alt+b", "alt+и"]
focus_pane_left = "alt+left"
focus_pane_right = "alt+right"
focus_pane_up = "alt+up"
focus_pane_down = "alt+down"

[keys.indexed]
tabs = "alt"

# Sidebar (values reported by `today all`; without it running these lines are empty):
#   spaces: one line of what the workspace's sessions need ($work), e.g. "1 need you · 2 working · 3 can close"
#   agents: what the session needs from you ($verdict) and its name ($name: the brief's name, or its task);
#           when its brief has "progress:", a bar + % ($progress), the ETA ($eta) and the brief's status ($doing)
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [{ token = "$work", dim = true, rules = [{ contains = "need you", fg = "#e06c75", dim = false }, { contains = "can close", fg = "#56b6c2" }] }],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "$verdict", rules = [{ starts_with = "needs you", fg = "#e06c75", bold = true }, { starts_with = "can close", fg = "#56b6c2" }, { starts_with = "working", fg = "#98c379" }, { starts_with = "paused", dim = true }] }],
  [{ token = "$name", bold = true }],
  [{ token = "$progress", fg = "#98c379" }, { token = "$eta", dim = true }],
  [{ token = "$doing", dim = true }],
  [{ token = "workspace", dim = true }],
]
